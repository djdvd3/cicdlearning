name: Model Retraining Pipeline

on:
  push:
    paths:
      - 'data/raw/**'  # ONLY triggers when files in data/raw change

jobs:
  retrain:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.3.2'
    
    - name: Install dependencies
      run: |
        R -e "install.packages(c('caret', 'readr', 'dplyr', 'yaml', 'pROC'))"
    
    - name: Clean data
      run: Rscript R/clean_data.R
    
    - name: Train model
      run: Rscript R/train_model.R
    
    - name: Evaluate model
      run: Rscript R/evaluate_model.R
    
    - name: Commit updates
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add data/processed/ models/ outputs/
        git commit -m "Auto-update: Retrained model [skip ci]" || echo "No changes to commit"
        git push
    
    - name: Send email notification
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: djdvd3@gmail.com
        password: ${{ secrets.EMAIL_PASSWORD }}  # Your Gmail App Password
        subject: "Model Retrained - New Data Detected"
        to: djdvd3@gmail.com
        from: djdvd3@gmail.com
        body: |
          New data triggered model retraining!
          
          Performance Metrics:
          $(cat outputs/metrics/latest_metrics.yaml | grep -E 'f1_score|auc_roc')
          
          Details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        content_type: text/plain
